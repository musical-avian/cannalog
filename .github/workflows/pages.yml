name: check and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @biomejs/biome@2.5.15 ci .
      - run: node --test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html app.js calc.js store.js sw.js manifest.webmanifest icon.svg vendor docs _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
